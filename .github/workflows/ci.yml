name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # The complete backend suite requires the dedicated PostgreSQL test database below.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: remind
          POSTGRES_PASSWORD: remind_dev
          POSTGRES_DB: remind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remind -d remind_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://remind:remind_dev@localhost:5432/remind_test
      JWT_SECRET: ci-only-secret-not-for-deployment
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest
